name: Build Packages (25.12 - aarch64_generic)

on:
  workflow_dispatch:  # 手动触发
  push:
    tags: 
      - 'v*'         # 标签推送时触发
  pull_request:       # PR 时触发

env:
  # 通用 ARM64 (aarch64) 架构的 25.12 (Snapshot) SDK 链接
  SDK_URL: "https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/immortalwrt-sdk-armsr-armv8_gcc-14.2.0_musl.Linux-x86_64.tar.zst"
  CONFIG_URL: "https://raw.githubusercontent.com/QC3284/nas-packages-luci-actions/main/test.config.txt"

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-setuptools rsync \
          swig unzip zlib1g-dev file wget axel zstd p7zip-full

    - name: Download ImmortalWrt SDK
      run: |
        axel -n 8 -o sdk.tar.zst ${{ env.SDK_URL }}

    - name: Extract SDK and Set Env
      run: |
        tar -I zstd -xvf sdk.tar.zst
        SDK_DIR_NAME=$(ls -d immortalwrt-sdk-* | head -n 1)
        echo "SDK_DIR=$SDK_DIR_NAME" >> $GITHUB_ENV

    - name: Setup environment and feeds
      run: |
        cd ${{ env.SDK_DIR }}
        
        echo 'src-git nas https://github.com/linkease/nas-packages.git;master' >> feeds.conf.default
        echo 'src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main' >> feeds.conf.default
        echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Download config
      run: |
        cd ${{ env.SDK_DIR }}
        wget ${{ env.CONFIG_URL }} -O .config

    - name: Compile All Packages
      run: |
        cd ${{ env.SDK_DIR }}
        make defconfig
        make package/feeds/nas_luci/luci-app-quickstart/compile -j$(nproc)
        make package/feeds/istore/luci-app-store/compile -j$(nproc)
        make package/feeds/istore/luci-lib-taskd/compile -j$(nproc)
        make package/feeds/istore/luci-lib-xterm/compile -j$(nproc)

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

    - name: Find, list and collect APK files
      id: process-apk
      run: |
        cd ${{ env.SDK_DIR }}
        mkdir -p ../output_apks
        
        APK_FILES=$(find bin/packages/ -name "*.apk" \( -name "*quickstart*" -o -name "*store*" -o -name "*taskd*" -o -name "*xterm*" \) -type f)
        
        echo "Found APK files:"
        FILE_COUNT=0
        for file in $APK_FILES; do
          if [ -f "$file" ]; then
            echo "  - $(basename "$file")"
            ls -la "$file"
            cp "$file" ../output_apks/
            FILE_COUNT=$((FILE_COUNT+1))
          fi
        done
        
        echo "Total files found: $FILE_COUNT"
        echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT

    - name: Upload APK files as artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: compiled-apk-packages-aarch64-${{ github.run_id }}
        path: output_apks/*.apk
        retention-days: 30

    - name: Create Automatic Release
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      uses: softprops/action-gh-release@v2
      with:
        tag_name: auto-build-${{ github.run_id }}-${{ github.run_attempt }}
        name: "Auto Build #${{ github.run_number }} (${{ github.ref_name }})"
        body: |
          ## ImmortalWrt 25.12 Packages (aarch64_generic)
          
          **Build Information:**
          - Architecture: **aarch64_generic (armsr/armv8)**
          - Trigger: ${{ github.event_name }}
          - Date: ${{ steps.date.outputs.date }}
          - Files Count: ${{ steps.process-apk.outputs.file_count }}
          - Package Format: **APK**
          
          **Download:** All APK files are attached below.
        draft: false
        prerelease: false
        files: output_apks/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Output build summary
      run: |
        echo "## Build Summary (aarch64)" >> $GITHUB_STEP_SUMMARY
        echo "✅ Package compilation completed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "**Total Files:** ${{ steps.process-apk.outputs.file_count }} (APK format)" >> $GITHUB_STEP_SUMMARY
